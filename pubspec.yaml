name: cantina_verde
description: Digital menu with cart, add-ons and WhatsApp order message. Demo project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf
